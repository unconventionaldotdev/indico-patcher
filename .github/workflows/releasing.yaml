name: releasing

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check tag version
        run: |
          .github/bin/check-version.sh "${GITHUB_REF#refs/tags/v}"
      - name: Check tag signature
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          [ "$(jq -r .object.type <<<"$ref")" = tag ] || { echo "::error::$GITHUB_REF_NAME is not an annotated tag"; exit 1; }
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" -q .verification.verified)
          [ "$verified" = true ] || { echo "::error::$GITHUB_REF_NAME is not signed by a verified key"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check tag has no release
        # A read-only token lists published releases only, which are the ones
        # that must never be touched; a stale draft is harmless.
        run: |
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" -q '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id')
          [ -z "$existing" ] || { echo "::error::$GITHUB_REF_NAME already has a release"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Install dependencies
        run: |
          make install
      - name: Build wheel
        run: |
          uv build --wheel
      - name: Extract changelog
        run: |
          uv run .github/bin/extract-changelog.py ${{ github.ref_name }} /tmp/changelog.md
      - uses: actions/upload-artifact@v7
        name: Upload build artifacts
        with:
          name: wheel
          retention-days: 7
          path: ./dist/*.whl
      - uses: actions/upload-artifact@v7
        name: Upload changelog
        with:
          name: changelog
          retention-days: 7
          path: /tmp/changelog.md

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Draft release
        run: >-
          gh release create
          --draft
          --repo ${{ github.repository }}
          --title ${{ github.ref_name }}
          --notes-file changelog/changelog.md
          ${{ github.ref_name }}
          wheel/*
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: release
    environment:
      name: pypi
      url: https://pypi.org/project/indico-patcher/
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Publish package to Test PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          packages-dir: wheel/
          skip-existing: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: wheel/
      - name: Publish release
        run: >-
          gh release edit
          --draft=false
          --repo ${{ github.repository }}
          ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}

  cleanup:
    needs: [release, publish]
    if: (failure() || cancelled()) && needs.release.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Delete draft release
        run: >-
          gh release delete
          --yes
          --repo ${{ github.repository }}
          ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
